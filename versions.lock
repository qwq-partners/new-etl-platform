# versions.lock — 실행 판본 고정
#
# A(§6.1)·P(§8.1)가 `versions_lock_digest` 를 증거 레코드의 필수 항목으로 규정하는데
# 정작 이 파일이 저장소에 없었다(2026-08-27 리뷰에서 확인 — 17개 문서가 참조, 실물 0).
# 이 파일이 없으면 "어느 판본에서 잰 값인가" 를 답할 수 없고, 그러면 어떤 측정도
# 규범 근거가 되지 못한다.
#
# **UNSET 은 빈칸이 아니라 판정이다.** 채우지 않은 항목이 있으면 그 항목에 의존하는
# 측정은 미확정으로 남는다. 값을 지어내지 말고, 실제로 쓴 것을 적어라.
#
# 채우는 법은 각 항목의 verify 줄에 있다. 실행 후 반드시 실측값으로 갱신한다.

schema_version: "1.0.0"
profile: SANDBOX_CONTAINER   # LOCAL_WSL | CORP_POC | SANDBOX_CONTAINER
                        # 2026-08-27 S1~S3 회차. **로컬 WSL2 회차가 아니다** — Oracle 없는
                        # 일회성 원격 컨테이너다. WSL2 에서 돌릴 때 이 파일을 덮어쓴다.
                        #
                        # ⚠ **판본 충돌 기록**(2026-08-30 병합). main 에 2026-08-28 회차가
                        # profile: LOCAL_WSL 로 기록돼 있었다. 그 회차는 Spark 전체 배포판이
                        # 아니라 Maven 아티팩트만 받아 **컴파일·SPI 검증까지만** 한 회차이고
                        # (distribution: MAVEN_ARTIFACTS_PARTIAL), 이 회차는 전체 배포판으로
                        # spark-submit 까지 돌렸다. 더 넓은 쪽을 활성 lock 으로 둔다.
                        # 그 회차의 실측값은 아래 prior_measurements 에 그대로 남긴다.
                        # **LOCAL_WSL 표기가 실제 WSL2 였는지는 이 세션이 확인할 수 없다** —
                        # 아니었다면 profile 을 정정해야 한다(증거 등급이 달라진다).

runtime:
  jdk:
    version: "21.0.10"  # OpenJDK 21.0.10+7-Ubuntu-124.04
    vendor: "Ubuntu OpenJDK"
    target_release: 17  # build.sh 의 --release. 산출 바이트코드 major=61 실측
    verify: "java -version 2>&1 | head -1"
    note: "빌드 JDK 가 Spark 실행 JVM 보다 높으면 ServiceLoader 가 조용히 실패한다.
           build.sh 는 --release 로 바이트코드 레벨을 맞춰야 한다."
  spark:
    version: "4.2.0"
    scala: "2.13.18"    # 2.12·2.13 양쪽에서 같은 Java 소스가 컴파일됐다(아래 also_built)
    distribution: "spark-4.2.0-bin-hadoop3"
    tarball_sha512: "3a6559e8546ff387db8fe7a04b8fe4008853b467b972c2e343df8e14a81450534777719fc5d4998dd96519a86fdf9de140cee753c61e2e94db044d5f9555ddc4"
    also_built:       # S2·S3 를 같은 소스로 통과시킨 판본. 사내 판본이 정해지면 이 줄이 근거가 된다
      - "spark-3.5.9-bin-hadoop3 (Scala 2.12.18)"
      - "spark-3.5.9-bin-hadoop3-scala2.13 (Scala 2.13.8)"
    verify: "$SPARK_HOME/bin/spark-submit --version"
  python:
    version: "3.11.15"
    verify: "python3 -V"
    packages:
      oracledb: NOT_INSTALLED   # 이 회차는 Oracle 에 붙지 않는다(서버 없음)
      jsonschema: UNSET # 4.x 필요. 3.x 는 Draft 2020-12 미지원이라 suite 가 통과하지 못한다
                        # (S5 이후에 필요. 이 회차에서는 쓰이지 않았다)
      pyspark: BUNDLED  # spark-submit 이 $SPARK_HOME/python 을 PYTHONPATH 에 넣는다.
                        # 별도 설치 불필요를 S3 에서 실측 확인
      verify: "python3 -m pip list --format=freeze | grep -Ei 'oracledb|jsonschema|pyspark'"

oracle:
  server_version: UNSET     # 예: 19.21.0.0 — g0-0a 의 ver.product_component 실측값을 적는다
  edition: UNSET            # 예: EE | XE | FREE
  database_role: UNSET      # PRIMARY | PHYSICAL STANDBY
  data_guard: UNSET         # true | false — XE/FREE 는 지원하지 않는다(확인 필요)
  characterset: UNSET       # g0-0a 의 nls.characterset 실측값
  ojdbc:
    artifact: "ojdbc11-23.9.0.25.07.jar"   # Maven Central. MANIFEST Implementation-Version 실측 일치
    sha256: "f52e9335276cd3999c23bb5a364fa01a628f3468945444d03cb7f92271bca1da"
    verify: "unzip -p $OJDBC_JAR META-INF/MANIFEST.MF | grep -i implementation-version"
  sqlplus:
    version: UNSET          # G0-0A·C00 실행에 필요
    source: UNSET           # instantclient 패키지명·반입 경로

platform:                   # 아직 세우지 않았다면 UNSET 그대로 둔다
  dagster: UNSET
  iceberg: UNSET
  polaris: UNSET
  postgres: UNSET
  object_store: UNSET       # 예: MinIO RELEASE.xxxx

# 다른 회차의 실측값. **활성 lock 이 아니다** — 증거를 이 값들에 묶지 마라.
# 병합으로 덮어써 사라지지 않게 남겨 둔 기록이다(2026-08-30).
prior_measurements:
  - run: "2026-08-28 S0~S2 (main, commit c4ef9bf)"
    profile_as_recorded: LOCAL_WSL   # ⚠ 미확인. 위 profile 주석 참조
    jdk: "21.0.11 / OpenJDK"
    spark: "4.2.0 / Scala 2.13.16"
    distribution: "MAVEN_ARTIFACTS_PARTIAL"   # spark-sql/catalyst/core/common-utils/tags
                        # + scala-library 만. **컴파일·SPI 검증 전용**이며 spark-submit 불가
    python: "3.12.3"
    covered: "S0~S2 (SPI 시그니처·ServiceLoader 발견·canHandle·disabledJdbcConnProviderList 근거)"

# 이 lock 으로 얻은 증거를 어디에 묶는가
evidence_binding:
  rule: "모든 G0-0 증거 레코드는 이 파일의 sha256 을 versions_lock_digest 로 함께 기록한다.
         lock 이 바뀌면 이전 증거는 그 판본의 것이며, 새 판본의 근거로 재사용하지 않는다."
  digest_cmd: "sha256sum versions.lock"
