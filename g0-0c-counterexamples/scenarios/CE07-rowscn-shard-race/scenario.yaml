id: CE07
title: "ROWSCN shard cursor race"
traceability: [탐지 3축 §3.2]
entrypoint: run.py
requires:
  writable_fixture: true
  connections: 2
  concurrent_writer: true
  crash_injection: false
  spark_required: false

summary: |
  ORA_ROWSCN 스윕을 shard로 나눠 돌릴 때 shard별 cursor가 서로 다른 시점에 전진하면 그 사이 commit된 행이 어떤 shard의 window에도 들어가지 않을 수 있다.

steps:
  - "shard 2개로 스윕 시작(cursor 105/110처럼 어긋난 상태 구성)"
  - "두 shard 사이 구간에 commit 발생"
  - "스윕 완료 후 그 행이 어느 shard에서도 발견되지 않는지"

pass_criteria: |
  발견되지 않으면 REPRODUCED. global 단조 cursor 또는 shard 간 barrier가 막으면 MITIGATION_HOLDS

# cleanup은 시나리오가 소유한다. 잔여 객체가 하나라도 있으면 suite는 PASS가 아니다.
cleanup:
  drop_objects_with_prefix: true
  verify_empty: true
