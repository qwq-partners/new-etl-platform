id: CE02
title: "CAS 이후의 동률 watermark late commit"
traceability: [F-02, 재검증 §1.3]
entrypoint: run.py
requires:
  writable_fixture: true
  connections: 2
  concurrent_writer: true
  crash_injection: false
  spark_required: false

summary: |
  R0가 high=successor(M)으로 CAS해 low를 전진시킨 뒤, watermark가 정확히 M인 트랜잭션이 commit된다. 다음 회차는 high=low가 되어 Spark 제출 자체가 없다(FINALIZED_NO_DATA).

steps:
  - "writer 세션 A: wm=M 행을 INSERT하고 commit하지 않은 채 유지"
  - "reader 세션 B: MAX(wm)=M 관측 → [low, successor(M)) 적재 → watermark CAS"
  - "그 뒤 A commit"
  - "다음 회차 실행: high==low 인지, Spark 제출이 0인지, 그 행이 적재됐는지"

pass_criteria: |
  그 행이 어떤 회차에도 들어오지 않으면 COUNTEREXAMPLE_REPRODUCED. source progress가 다시 생겼을 때만 회수되는지도 함께 기록

# cleanup은 시나리오가 소유한다. 잔여 객체가 하나라도 있으면 suite는 PASS가 아니다.
cleanup:
  drop_objects_with_prefix: true
  verify_empty: true
