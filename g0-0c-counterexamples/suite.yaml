schema_version: "1.0.0"
suite_id: "G0-0C-COUNTEREXAMPLES"
# runner.py가 기동 시 각 scenario 디렉터리의 파일 해시를 계산해 이 값과 대조한다.
# "" 이면 첫 실행에서 계산해 기록하고, 이후 불일치는 SUITE_ABORT다.
artifact_sha256: ""

required_scenarios: [CE01, CE02, CE03, CE04, CE05, CE06, CE07, CE08, CE09]

# ─────────────────────────────────────────────────────────────────────
# 환경 가드 — 이 suite는 **쓰기 가능한 폐기용 환경에서만** 돈다.
# runner는 아래 세 가지를 실행 전에 검증하고 하나라도 어긋나면 즉시 중단한다.
#   1. primary/standby의 DB_UNIQUE_NAME이 expected 값과 정확히 일치
#   2. 대상 스키마가 allowed_schema이고 모든 객체가 object_prefix로 시작
#   3. production_forbidden=true이면 운영 식별자 패턴에 하나라도 걸리면 중단
# ─────────────────────────────────────────────────────────────────────
environment_guard:
  class: DISPOSABLE_WRITABLE_PRIMARY_ADG
  expected_primary_db_unique_name: ""     # 예: ETLPOC_PRI  (필수, 빈 값이면 중단)
  expected_standby_db_unique_name: ""     # 예: ETLPOC_STB  (필수, 빈 값이면 중단)
  allowed_schema: ""                      # 예: ETL_CE      (필수)
  object_prefix: "CE_"                    # 모든 fixture 객체 이름의 접두사
  production_forbidden: true
  # 운영 식별자 차단 패턴(대소문자 무시). 하나라도 매치하면 SUITE_ABORT.
  forbidden_name_patterns: ["PRD", "PROD", "REAL", "LIVE", "운영"]

versions:
  oracle: ""      # 예: 19.21.0.0
  ojdbc: ""       # 예: ojdbc11-23.4.0.24.05
  spark: ""       # 예: 4.2.0   — CE06/CE08은 이 값에 따라 기대가 갈린다
  runner: "1.0.0"

budgets:
  max_sessions: 12          # suite 전체가 동시에 여는 physical connection 상한
  statement_timeout_s: 60
  suite_timeout_s: 3600

# 모든 required_scenario가 실행되고, 각 시나리오가 자기 injection을 실제로
# 관측했을 때만 suite가 PASS다. 시나리오 누락·injection 미관측은 PASS가 아니다.
pass_rule: all_required_executed_and_injection_observed

# 결과 값 5종. runner는 이 외의 값을 허용하지 않는다.
outcomes:
  - COUNTEREXAMPLE_REPRODUCED   # 반례가 재현됐다(설계 결함 확인)
  - MITIGATION_HOLDS            # 완화책이 실제로 막았다
  - MITIGATION_FAIL             # 완화책이 있었으나 막지 못했다
  - INJECTION_NOT_OBSERVED      # 주입 자체가 관측되지 않았다 → PASS 아님
  - INCONCLUSIVE                # 환경·타이밍 때문에 판정 불가 → PASS 아님

# 각 시나리오가 무엇을 닫으려 하는지(추적성). runner가 evidence에 복사한다.
traceability:
  CE01: ["F-01", "NEW-01", "typed_successor round-trip"]
  CE02: ["F-02", "재검증 §1.3 equal-wm late commit after CAS"]
  CE03: ["F-04", "NEW-08", "future-dated outlier가 MAX인 상태"]
  CE04: ["F-05", "NULL watermark 영구 제외 / empty bootstrap"]
  CE05: ["F-06", "두 watermark Merge의 독립 seal"]
  CE06: ["F-09", "NEW-05", "NEW-25", "multi-connection snapshot skew"]
  CE07: ["탐지 3축 §3.2", "ROWSCN shard cursor race"]
  CE08: ["NEW-14", "mid-sweep crash와 cursor non-advance"]
  CE09: ["NEW-15", "transient insert→delete와 same-PK reuse"]
